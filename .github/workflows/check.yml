name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: go generate ./...
      - run: git diff --exit-code
      - run: make check
      - run: make example
      - name: Verify browser plugins against live Go hosts
        run: |
          npm exec -- playwright install --with-deps --no-shell chromium
          FRAME_CHROME_EXECUTABLE=$(node -p 'require("playwright").chromium.executablePath()')
          test -x "$FRAME_CHROME_EXECUTABLE"
          export FRAME_CHROME_EXECUTABLE
          ./scripts/check-browser-workflows.sh
