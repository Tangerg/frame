name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - run: go generate ./...
      - name: Verify generated outputs in a clean checkout
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Verify independent Go module consumer
        run: python3 scripts/go-consumer.py
      - run: make check
      - run: make example
      - name: Verify browser plugins against live Go hosts
        run: |
          npm exec -- playwright install --with-deps --no-shell chromium
          FRAME_CHROME_EXECUTABLE=$(node -p 'require("playwright").chromium.executablePath()')
          test -x "$FRAME_CHROME_EXECUTABLE"
          export FRAME_CHROME_EXECUTABLE
          ./scripts/check-browser-workflows.sh
  minimum-sdk-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Read the SDK's minimum supported Node version
        id: runtime
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { readFileSync } from "node:fs";
          const { engines } = JSON.parse(readFileSync("sdk/package.json", "utf8"));
          const minimum = /^>=(\d+\.\d+\.\d+)$/.exec(engines.node);
          if (!minimum) throw new Error("SDK Node support must declare one minimum version");
          console.log(`version=${minimum[1]}`);
          JS
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ steps.runtime.outputs.version }}
      - run: npm run check:pack
